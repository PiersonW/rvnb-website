<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault Runner 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;color:#e8ecff;
    font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .hud{position:fixed;pointer-events:none;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.8);font-size:11px;line-height:1.9}
  #tl{top:14px;left:16px}
  #tc{top:14px;left:50%;transform:translateX(-50%);text-align:center}
  #gold{color:#ffd24a;font-size:13px}
  #msg{margin-top:10px;color:#9ff;min-height:20px;font-size:11px;transition:opacity .4s;max-width:min(760px,60vw);line-height:1.9;background:rgba(4,10,8,.45);padding:4px 10px;border-radius:6px}
  #bl{bottom:16px;left:16px}
  #bl .t{display:flex;gap:10px;align-items:center;opacity:.95}
  #bl .k{display:inline-block;min-width:44px;text-align:center;border:2px solid #7f8bd0;border-radius:5px;padding:1px 4px;background:rgba(10,14,40,.6);font-size:9px}
  #bl .z{opacity:.4}
  #br{bottom:16px;right:16px;text-align:center}
  #map{display:block;width:210px;height:210px;border:3px solid #7f8bd0;border-radius:8px;background:rgba(4,6,18,.82);image-rendering:pixelated}
  #floor{margin-bottom:4px;font-size:10px;color:#b9c4ff}
  #warn{top:38%;left:50%;transform:translateX(-50%);color:#ff5560;font-size:14px;white-space:nowrap;animation:bl .5s steps(2) infinite}
  .btn{display:inline-block;margin-top:16px;padding:9px 14px;border:2px solid #7f8bd0;border-radius:8px;font-size:10px;color:#cfe;background:rgba(20,26,70,.7)}
  .btn:hover,.lv:hover{background:#2a3590;border-color:#fff}
  .lvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:52vh;overflow:auto;width:min(700px,86vw);padding:4px}
  .lv{border:2px solid #39407a;border-radius:8px;padding:8px 6px;background:rgba(8,10,30,.7);display:flex;flex-direction:column;gap:5px;font-size:8px;line-height:1.5}
  .lv b{font-size:16px;color:#ffd24a;font-weight:normal}.lv small{color:#8fd8ff;font-size:7px}
  #hot{bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:7px;white-space:nowrap;width:min(760px,54vw)}
  #hot span{border:2px solid #39407a;border-radius:6px;padding:5px 6px 3px;background:rgba(8,10,30,.75);text-align:center;line-height:1.5}
  #hot span.on{border-color:#ffd24a;background:#2a3590;color:#ffd24a}
  #hot i{display:block;font-style:normal;color:#8fd8ff;font-size:7px}
  .btn.sm{margin-top:4px;padding:5px 7px;font-size:8px}
  .lv i{font-style:normal;color:#ffd24a}
  .pf{outline:3px solid #ffd24a;outline-offset:2px}
  .val{display:inline-block;min-width:110px;text-align:center;color:#ffd24a}
  #ov textarea,#ov input{font:inherit;font-size:9px;background:#0a0d24;color:#cfe;border:2px solid #39407a;border-radius:6px;padding:6px;cursor:text;user-select:text;-webkit-user-select:text}
  #ov textarea{display:block;width:min(640px,84vw);height:64px;margin:6px auto;word-break:break-all}
  #cpm{font-size:9px;color:#ffb}
  #ov .box{max-height:96vh;overflow:auto}
  #cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none;opacity:.85}
  #cross:before,#cross:after{content:"";position:absolute;background:#bff;box-shadow:0 0 4px #0ff}
  #cross:before{left:8px;top:0;width:2px;height:18px}
  #cross:after{top:8px;left:0;height:2px;width:18px}
  #flash{position:fixed;inset:0;pointer-events:none;background:#f22;opacity:0}
  #hint{bottom:240px;right:16px;font-size:9px;color:#ffb;max-width:230px;text-align:right;display:none}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(12,16,48,.86),rgba(2,3,10,.96));cursor:pointer}
  #ov .box{max-width:720px;padding:24px;text-align:center}
  #ov h1{font-size:34px;margin:0 0 6px;color:#ffd24a;text-shadow:0 4px 0 #7a3b00,0 0 24px rgba(255,180,40,.5);letter-spacing:2px}
  #ov h2{font-size:12px;margin:0 0 22px;color:#8fd8ff;font-weight:normal}
  #ov .grid{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;text-align:left;font-size:10px;line-height:1.6;
    background:rgba(8,10,30,.6);border:2px solid #39407a;border-radius:10px;padding:16px 18px;margin:0 auto 20px}
  #ov .grid b{color:#ffd24a;font-weight:normal;white-space:nowrap}
  #ov .go{font-size:14px;color:#fff;animation:bl 1.1s steps(2) infinite}
  #ov p{font-size:10px;line-height:1.8;color:#c9d2ff}
  @keyframes bl{50%{opacity:.25}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="cross"></div>
<div class="hud" id="tl"><div id="lvl"></div><div id="score"></div><div id="lives" style="color:#ff6b7a"></div><div id="time" style="color:#b9c4ff;font-size:9px"></div></div>
<div class="hud" id="tc"><div id="gold"></div><div id="msg"></div></div>
<div class="hud" id="warn"></div>
<div class="hud" id="hot"></div>
<div class="hud" id="bl"></div>
<div class="hud" id="hint">Mouse not captured: drag to look, or use the arrow keys.</div>
<div class="hud" id="br"><div id="floor"></div><canvas id="map" width="210" height="210"></canvas></div>
<div id="ov"><div class="box" id="ovbox"></div></div>
