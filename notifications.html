<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — RVnB</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --night:#0B1220; --amber:#FFB547; --lane:#FAF7F0; --sign-green:#2F7D5B; --asphalt:#64748B; --red:#a4472b; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--lane); color:var(--night); line-height:1.6;}
  .wrap{max-width:560px; margin:0 auto; padding:0 24px;}
  header{background:var(--night); color:var(--lane); padding:16px 0;}
  header .wrap{display:flex; justify-content:space-between; align-items:center;}
  header a{color:var(--amber); text-decoration:none; font-size:14px;}
  .page-top{display:flex; justify-content:space-between; align-items:center; margin:36px 0 20px;}
  h1{font-family:'Manrope',sans-serif; text-transform:uppercase; font-size:clamp(24px,4vw,30px);}
  #mark-all-read{
    background:none; border:none; color:var(--sign-green); font-size:12px; font-weight:700;
    text-transform:uppercase; cursor:pointer; padding:0;
  }
  #loading, #empty{padding:60px 0; text-align:center; color:var(--asphalt); font-family:'JetBrains Mono',monospace;}
  #empty{display:none;}
  #list{display:none; background:#fff; border:2px solid var(--night); border-radius:12px; overflow:hidden; margin-bottom:40px;}
  .notif-item{padding:16px 18px; border-bottom:1px solid #eee0cf; cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:#fdf7ea;}
  .notif-item .row{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .notif-item .title{font-weight:700; font-size:14px;}
  .notif-item .dot{width:8px; height:8px; border-radius:50%; background:var(--amber); flex-shrink:0; margin-top:5px;}
  .notif-item .msg{font-size:13px; color:var(--asphalt); margin-top:4px; line-height:1.4;}
  .notif-item .when{font-size:11px; color:var(--asphalt); margin-top:6px; font-family:'JetBrains Mono',monospace;}
  .notif-item .count-badge{
    background:var(--asphalt); color:#fff; font-size:11px; font-weight:700;
    border-radius:20px; padding:2px 8px; flex-shrink:0; font-family:'JetBrains Mono',monospace;
  }
  .notif-item.unread .count-badge{background:var(--sign-green);}
</style>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "36911a5edb0f4bdf95ab6da85ceccd46"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" style="color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px; font-family:'Manrope',sans-serif; font-weight:700; text-transform:uppercase;">
      <img src="logo-64-light.png" width="20" height="20" alt="" style="flex-shrink:0;"><span style="text-transform:none; letter-spacing:normal;">RV<span style="color:var(--sign-green);">n</span>B</span>
    </a>
    <a href="index.html" id="back-link">← Back</a>
  </div>
</header>

<div class="wrap">
  <div class="page-top">
    <h1>Notifications</h1>
    <button id="mark-all-read" style="display:none;">Mark all read</button>
  </div>

  <div id="loading">Loading notifications...</div>
  <div id="empty">Nothing yet — you'll see booking and listing updates here.</div>
  <div id="list"></div>
</div>

<script>
  const SUPABASE_URL = 'https://icnhpciixqrhrqrzxkxg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljbmhwY2lpeHFyaHJxcnp4a3hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTY2MDMsImV4cCI6MjA5OTczMjYwM30.5a8nNSiSA7U89f2kGAHGNPPfYpFra0Ve7PIFtOq3GDk';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  const params = new URLSearchParams(window.location.search);
  const returnTo = params.get('return');
  if(returnTo){
    document.getElementById('back-link').href = returnTo;
  }

  function timeAgo(dateStr){
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if(hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if(days < 7) return days + 'd ago';
    return new Date(dateStr).toLocaleDateString();
  }

  async function init(){
    const { data } = await supabaseClient.auth.getSession();
    if(!data.session){
      window.location.href = 'index.html';
      return;
    }
    currentUser = data.session.user;
    loadNotifications();
  }

  async function loadNotifications(){
    // Fetch a deeper window than we'll display — a chatty thread can otherwise
    // push older booking/listing notifications out of a shallow limit before
    // we ever get a chance to group the messages together.
    const { data, error } = await supabaseClient
      .from('notifications')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false })
      .limit(300);

    document.getElementById('loading').style.display = 'none';

    if(error){
      document.getElementById('empty').style.display = 'block';
      document.getElementById('empty').textContent = 'Could not load notifications.';
      return;
    }

    const listEl = document.getElementById('list');
    const unreadCount = (data || []).filter(n => !n.is_read).length;
    document.getElementById('mark-all-read').style.display = unreadCount > 0 ? 'block' : 'none';

    if(!data || data.length === 0){
      document.getElementById('empty').style.display = 'block';
      listEl.style.display = 'none';
      return;
    }

    document.getElementById('empty').style.display = 'none';
    listEl.style.display = 'block';

    // Collapse repeat "new_message" notifications that belong to the same
    // conversation into a single row (latest preview + a count), so an
    // active thread doesn't bury everything else in the list. Non-message
    // notifications stay one row each. Order is preserved — a group sits
    // wherever its most recent message would have sorted.
    //
    // Group by the booking's thread id, not the raw link string: a single
    // conversation produces two different link prefixes depending on who's
    // being notified — "host-dashboard.html?thread=X" when the host is the
    // recipient, "traveler-dashboard.html?thread=X" when the traveler is —
    // which happens on both sides of the same booking whenever one account
    // is testing as both host and traveler. Keying off the link itself was
    // splitting one conversation into two groups; the thread id is the
    // actual conversation identity.
    function threadKeyFor(n){
      if(!n.link) return null;
      const qIndex = n.link.indexOf('?');
      if(qIndex === -1) return n.link;
      const threadId = new URLSearchParams(n.link.slice(qIndex)).get('thread');
      return threadId ? 'thread-' + threadId : n.link;
    }

    const groups = [];
    const groupByKey = {};
    data.forEach(n => {
      const key = n.type === 'new_message' ? threadKeyFor(n) : null;
      if(key){
        let g = groupByKey[key];
        if(!g){
          g = { isGroup: true, link: n.link, title: n.title, message: n.message, created_at: n.created_at, count: 0, unreadCount: 0, ids: [] };
          groupByKey[key] = g;
          groups.push(g);
        }
        g.count++;
        if(!n.is_read) g.unreadCount++;
        g.ids.push(n.id);
      } else {
        groups.push({ isGroup: false, id: n.id, link: n.link, title: n.title, message: n.message, created_at: n.created_at, is_read: n.is_read });
      }
    });

    const visible = groups.slice(0, 50);

    listEl.innerHTML = visible.map(n => {
      const isUnread = n.isGroup ? n.unreadCount > 0 : !n.is_read;
      const idsAttr = n.isGroup ? n.ids.join(',') : n.id;
      return `
      <div class="notif-item ${isUnread ? 'unread' : ''}" data-ids="${idsAttr}" data-link="${n.link || ''}">
        <div class="row">
          <span class="title">${n.title}</span>
          ${n.isGroup && n.count > 1
            ? `<span class="count-badge">${n.count}</span>`
            : (isUnread ? '<span class="dot"></span>' : '')}
        </div>
        ${n.message ? `<div class="msg">${n.message}</div>` : ''}
        <div class="when">${timeAgo(n.created_at)}</div>
      </div>
    `;
    }).join('');

    document.querySelectorAll('.notif-item').forEach(item => {
      item.addEventListener('click', async () => {
        const ids = item.dataset.ids.split(',');
        const link = item.dataset.link;
        await supabaseClient.from('notifications').update({ is_read: true }).in('id', ids);
        if(link){
          window.location.href = link;
        } else {
          loadNotifications();
        }
      });
    });
  }

  document.getElementById('mark-all-read').addEventListener('click', async () => {
    await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id).eq('is_read', false);
    loadNotifications();
  });

  init();
</script>

</body>
</html>
