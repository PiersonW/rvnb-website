<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Trips — RVnB</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --night:#0B1220; --amber:#FFB547; --lane:#FAF7F0; --sign-green:#2F7D5B;
    --asphalt:#64748B; --red:#a4472b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--lane); color:var(--night);}
  h1,h2,h3{font-family:'Manrope',sans-serif; text-transform:uppercase; letter-spacing:0.02em;}
  a{color:inherit;}
  .wrap{max-width:800px; margin:0 auto; padding:32px 24px 80px;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:28px; padding-bottom:16px; border-bottom:2px solid var(--night);
  }
  header .btns{display:flex; gap:10px;}
  header a, header button{
    background:none; border:1.5px solid var(--asphalt); color:var(--asphalt);
    padding:8px 16px; font-size:12px; text-transform:uppercase; font-weight:700;
    border-radius:999px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center;
  }

  .section-title{
    font-family:'JetBrains Mono',monospace; font-size:12px; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--sign-green); margin:32px 0 14px;
  }
  .section-title:first-of-type{margin-top:0;}
  .empty{color:var(--asphalt); font-family:'JetBrains Mono',monospace; font-size:13px; padding:24px 0;}

  .card{background:#fff; border:2px solid var(--night); border-radius:10px; padding:20px; margin-bottom:14px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  .card h3{font-size:17px;}
  .status{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; padding:3px 8px; border-radius:10px;}
  .status.pending{background:#f2e4c4; color:#8a6415;}
  .status.confirmed{background:#d8ebe0; color:var(--sign-green);}
  .status.cancelled{background:#f0dcd6; color:var(--red);}
  .status.completed{background:#dbe4ea; color:#3a5f7a;}
  .meta{font-size:13px; color:var(--asphalt); margin-top:6px; line-height:1.7;}
  .meta b{color:var(--night);}
  .card-actions{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .trip-details{
    margin-top:16px; padding-top:14px; border-top:1px solid #e8e2d4;
    display:grid; grid-template-columns:1fr 1fr; gap:10px 20px;
  }
  .detail-row{font-size:13px;}
  .detail-row.full{grid-column:1/-1;}
  .detail-label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase;
    color:var(--asphalt); margin-bottom:2px; letter-spacing:0.04em;
  }
  .turnover-reminder{
    margin-top:14px; background:#402a10; color:#f5c877; padding:10px 12px;
    border-radius:10px; font-size:12px; line-height:1.5;
  }
  .turnover-reminder.allows-24hr{background:#16321f; color:#8fd8ac;}
  .btn-view{
    padding:8px 16px; border-radius:10px; font-size:12px; font-weight:700; text-transform:uppercase;
    border:2px solid var(--night); color:var(--night); text-decoration:none; display:inline-flex; align-items:center;
  }
  .btn-cancel{
    padding:8px 16px; border-radius:10px; font-size:12px; font-weight:700; text-transform:uppercase;
    border:none; cursor:pointer; background:var(--red); color:#fff;
  }
  .edit-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .edit-grid > div{min-width:0;}
  @media(max-width:520px){.edit-grid{grid-template-columns:1fr;}}
  .edit-grid label{
    font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--asphalt);
    display:block; margin-bottom:4px;
  }
  .edit-grid input{
    width:100%; min-width:0; padding:9px 11px; border:2px solid var(--night); border-radius:10px;
    font-family:'Inter',sans-serif; font-size:13px;
  }
  .btn-save{background:var(--night); color:var(--amber); border:none; padding:10px 18px; border-radius:10px; font-weight:700; font-size:12px; text-transform:uppercase; cursor:pointer;}
  .save-msg{font-size:12px; margin-top:8px; display:none;}
</style>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "36911a5edb0f4bdf95ab6da85ceccd46"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <a href="index.html" style="display:flex; align-items:center; gap:6px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; color:var(--night); text-decoration:none; margin-bottom:2px; border:none; padding:0; background:none;">
        <img src="logo-64.png" width="16" height="16" alt="" style="flex-shrink:0;"><span>RV<span style="color:var(--sign-green);">n</span>B</span>
      </a>
      <h1>My Trips</h1>
    </div>
    <div class="btns" style="position:relative; align-items:center;">
      <div id="notif-bell-wrap" style="position:relative;">
        <button id="notif-bell-btn" aria-label="Notifications" style="background:none; border:1.5px solid var(--asphalt); color:var(--night); width:42px; height:42px; padding:0; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="notif-badge" style="display:none; position:absolute; top:-2px; right:-2px; background:var(--red); color:#fff; font-size:10px; font-weight:700; min-width:17px; height:17px; border-radius:9px; align-items:center; justify-content:center; padding:0 4px; font-family:'Inter',sans-serif;"></span>
        </button>
        <div id="notif-dropdown" style="display:none; position:absolute; top:calc(100% + 8px); right:0; background:#fff; border:1.5px solid var(--night); border-radius:12px; min-width:320px; max-width:90vw; max-height:420px; overflow-y:auto; z-index:200; box-shadow:0 10px 28px rgba(11,18,32,0.25);">
          <div style="padding:14px 16px; border-bottom:1px solid #eee0cf; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; text-transform:uppercase;">Notifications</span>
            <button id="notif-mark-all-read" style="background:none; border:none; color:var(--sign-green); font-size:11px; font-weight:700; text-transform:uppercase; cursor:pointer; padding:0;">Mark all read</button>
          </div>
          <div id="notif-list"><div style="padding:20px; text-align:center; color:var(--asphalt); font-size:13px;">Loading...</div></div>
        </div>
      </div>
      <a href="index.html">← Home</a>
      <button id="logout-btn">Sign Out</button>
    </div>
  </header>

  <div class="card" id="my-info-card">
    <div class="card-top" id="my-info-toggle" style="cursor:pointer; align-items:center;">
      <h3>My Info</h3>
      <span id="my-info-caret" style="font-size:14px; color:var(--asphalt);">▾</span>
    </div>
    <div id="my-info-fields" style="display:none; margin-top:14px;">
      <div class="edit-grid">
        <div>
          <label>Name</label>
          <input type="text" id="my-info-name">
        </div>
        <div>
          <label>Phone</label>
          <input type="tel" id="my-info-phone">
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-save" id="my-info-save">Save Changes</button>
      </div>
      <div class="save-msg" id="my-info-msg">Saved!</div>
    </div>
  </div>

  <div class="section-title">Upcoming</div>
  <div id="upcoming-container"><div class="empty">Loading...</div></div>

  <div class="section-title">Past &amp; Cancelled</div>
  <div id="past-container"></div>
</div>

<script>
  const SUPABASE_URL = 'https://icnhpciixqrhrqrzxkxg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljbmhwY2lpeHFyaHJxcnp4a3hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTY2MDMsImV4cCI6MjA5OTczMjYwM30.5a8nNSiSA7U89f2kGAHGNPPfYpFra0Ve7PIFtOq3GDk';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  async function init(){
    const { data } = await supabaseClient.auth.getSession();
    if(!data.session){
      window.location.href = 'traveler-login.html?return=traveler-dashboard.html';
      return;
    }

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('is_paused, full_name, phone')
      .eq('id', data.session.user.id)
      .single();

    if(profile && profile.is_paused){
      await supabaseClient.auth.signOut();
      window.location.href = 'traveler-login.html?paused=1';
      return;
    }

    if(profile){
      document.getElementById('my-info-name').value = profile.full_name || '';
      document.getElementById('my-info-phone').value = profile.phone || '';
    }

    currentUser = data.session.user;
    loadTrips();
    loadNotifications();
  }

  document.getElementById('my-info-toggle').addEventListener('click', () => {
    const fields = document.getElementById('my-info-fields');
    const caret = document.getElementById('my-info-caret');
    const isOpen = fields.style.display === 'block';
    fields.style.display = isOpen ? 'none' : 'block';
    caret.style.transform = isOpen ? '' : 'rotate(180deg)';
  });

  document.getElementById('my-info-save').addEventListener('click', async () => {
    const full_name = document.getElementById('my-info-name').value.trim();
    const phone = document.getElementById('my-info-phone').value.trim() || null;
    const msg = document.getElementById('my-info-msg');

    const { error } = await supabaseClient.from('profiles').update({ full_name, phone }).eq('id', currentUser.id);
    if(error){
      msg.style.color = 'var(--red)';
      msg.textContent = 'Error: ' + error.message;
      msg.style.display = 'block';
      return;
    }
    msg.style.color = 'var(--sign-green)';
    msg.textContent = 'Saved!';
    msg.style.display = 'block';
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'traveler-login.html';
  });

  async function loadTrips(){
    const upcomingEl = document.getElementById('upcoming-container');
    const pastEl = document.getElementById('past-container');
    upcomingEl.innerHTML = '<div class="empty">Loading...</div>';
    pastEl.innerHTML = '';

    const { data, error } = await supabaseClient
      .from('bookings')
      .select('*, partners(id, business_name, city, state, address, arrival_time, departure_time, allows_24hr_parking, rules)')
      .eq('traveler_id', currentUser.id)
      .order('check_in', { ascending: true });

    if(error){
      upcomingEl.innerHTML = '<div class="empty">Could not load trips: ' + error.message + '</div>';
      return;
    }

    const today = new Date().toISOString().slice(0,10);
    const upcoming = data.filter(b => b.check_out >= today && b.status !== 'cancelled' && b.status !== 'completed');
    const past = data.filter(b => b.check_out < today || b.status === 'cancelled' || b.status === 'completed');

    upcomingEl.innerHTML = upcoming.length === 0 ? '<div class="empty">No upcoming trips yet — go find a spot!</div>' : '';
    upcoming.forEach(b => upcomingEl.appendChild(renderCard(b, true)));

    pastEl.innerHTML = past.length === 0 ? '<div class="empty">No past trips yet.</div>' : '';
    past.forEach(b => pastEl.appendChild(renderCard(b, false)));
  }

  function formatTime12hr(hhmm){
    if(!hhmm) return '';
    const [h, m] = hhmm.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const hour12 = h % 12 === 0 ? 12 : h % 12;
    return `${hour12}:${String(m).padStart(2,'0')} ${period}`;
  }

  function renderCard(b, allowCancel){
    const card = document.createElement('div');
    card.className = 'card';
    const p = b.partners;
    const spot = p ? p.business_name : 'Listing';
    const address = p ? `${p.address}, ${p.city}, ${p.state}` : '';
    card.innerHTML = `
      <div class="card-top">
        <div>
          <h3>${spot}</h3>
          <div class="meta">
            <b>${b.check_in} → ${b.check_out}</b><br>
            ${address}<br>
            $${b.total_charged ? Number(b.total_charged).toFixed(2) : Number(b.total_price).toFixed(2)} total (incl. fees &amp; tax)
          </div>
        </div>
        <span class="status ${b.status}">${b.status}</span>
      </div>

      ${p ? `
      <div class="trip-details">
        <div class="detail-row"><span class="detail-label">Arrive after</span><span>${formatTime12hr(p.arrival_time)}</span></div>
        <div class="detail-row"><span class="detail-label">Leave by</span><span>${formatTime12hr(p.departure_time)}</span></div>
        ${p.rules ? `<div class="detail-row full"><span class="detail-label">House rules</span><span>${p.rules}</span></div>` : ''}
      </div>
      <div class="turnover-reminder${p.allows_24hr_parking ? ' allows-24hr' : ''}">${
        p.allows_24hr_parking
          ? '✓ 24-hour parking — this is a designated RV spot, no daily departure required.'
          : `⚠ Vehicle must leave the lot by ${formatTime12hr(p.departure_time)} each morning and may not return until ${formatTime12hr(p.arrival_time)} — every night of this stay, not just once.`
      }</div>
      ` : ''}

      <div class="card-actions">
        ${p ? `<a href="listing.html?id=${p.id}&from=trips" class="btn-view">View Listing</a>` : ''}
        ${allowCancel && b.status !== 'cancelled' ? `<button class="btn-cancel" data-id="${b.id}">Cancel Trip</button>` : ''}
      </div>
    `;
    const cancelBtn = card.querySelector('.btn-cancel');
    if(cancelBtn){
      cancelBtn.addEventListener('click', async () => {
        if(!confirm('Cancel this trip? The host will be notified.')) return;
        cancelBtn.disabled = true;
        cancelBtn.textContent = 'Cancelling...';
        const { data, error } = await supabaseClient.functions.invoke('traveler-cancel-booking', {
          body: { bookingId: cancelBtn.dataset.id, confirm: true }
        });
        if(error || (data && data.error)){
          alert('Could not cancel: ' + (data?.error || error?.message || 'unknown error'));
          cancelBtn.disabled = false;
          cancelBtn.textContent = 'Cancel Trip';
          return;
        }
        loadTrips();
      });
    }
    return card;
  }

  // ============================================
  // NOTIFICATION BELL
  // ============================================
  function timeAgo(dateStr){
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if(hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if(days < 7) return days + 'd ago';
    return new Date(dateStr).toLocaleDateString();
  }

  async function loadNotifications(){
    const { data, error } = await supabaseClient
      .from('notifications')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false })
      .limit(30);

    const listEl = document.getElementById('notif-list');
    const badgeEl = document.getElementById('notif-badge');

    if(error){
      listEl.innerHTML = `<div style="padding:20px; text-align:center; color:var(--asphalt); font-size:13px;">Could not load notifications.</div>`;
      return;
    }

    const unreadCount = (data || []).filter(n => !n.is_read).length;
    if(unreadCount > 0){
      badgeEl.style.display = 'flex';
      badgeEl.textContent = unreadCount > 9 ? '9+' : unreadCount;
    } else {
      badgeEl.style.display = 'none';
    }

    if(!data || data.length === 0){
      listEl.innerHTML = `<div style="padding:20px; text-align:center; color:var(--asphalt); font-size:13px;">Nothing yet — you'll see booking updates here.</div>`;
      return;
    }

    listEl.innerHTML = data.map(n => `
      <div class="notif-item" data-id="${n.id}" data-link="${n.link || ''}" style="padding:13px 16px; border-bottom:1px solid #f1ede0; cursor:pointer; ${n.is_read ? '' : 'background:#fdf7ea;'}">
        <div style="display:flex; justify-content:space-between; gap:8px; align-items:flex-start;">
          <span style="font-weight:700; font-size:13px;">${n.title}</span>
          ${n.is_read ? '' : '<span style="width:8px; height:8px; border-radius:50%; background:var(--amber); flex-shrink:0; margin-top:4px;"></span>'}
        </div>
        <div style="font-size:12px; color:var(--asphalt); margin-top:3px; line-height:1.4;">${n.message || ''}</div>
        <div style="font-size:10px; color:var(--asphalt); margin-top:5px; font-family:'JetBrains Mono',monospace;">${timeAgo(n.created_at)}</div>
      </div>
    `).join('');

    document.querySelectorAll('.notif-item').forEach(item => {
      item.addEventListener('click', async () => {
        const id = item.dataset.id;
        const link = item.dataset.link;
        await supabaseClient.from('notifications').update({ is_read: true }).eq('id', id);
        if(link && link !== window.location.pathname.split('/').pop()){
          window.location.href = link;
        } else {
          loadNotifications();
        }
      });
    });
  }

  document.getElementById('notif-bell-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    const dropdown = document.getElementById('notif-dropdown');
    const isOpen = dropdown.style.display === 'block';
    dropdown.style.display = isOpen ? 'none' : 'block';
    if(!isOpen) loadNotifications();
  });

  document.addEventListener('click', (e) => {
    const wrap = document.getElementById('notif-bell-wrap');
    if(!wrap.contains(e.target)){
      document.getElementById('notif-dropdown').style.display = 'none';
    }
  });

  document.getElementById('notif-mark-all-read').addEventListener('click', async (e) => {
    e.stopPropagation();
    await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id).eq('is_read', false);
    loadNotifications();
  });

  init();
</script>

</body>
</html>
