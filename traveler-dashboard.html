<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Trips — RVnB</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --night:#0B1220; --amber:#FFB547; --lane:#FAF7F0; --sign-green:#2F7D5B;
    --asphalt:#64748B; --red:#a4472b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--lane); color:var(--night);}
  h1,h2,h3{font-family:'Manrope',sans-serif; text-transform:uppercase; letter-spacing:0.02em;}
  a{color:inherit;}
  .wrap{max-width:800px; margin:0 auto; padding:32px 24px 80px;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:28px; padding-bottom:16px; border-bottom:2px solid var(--night);
  }
  header .btns{display:flex; gap:10px;}
  header a, header button{
    background:none; border:1.5px solid var(--asphalt); color:var(--asphalt);
    padding:8px 16px; font-size:12px; text-transform:uppercase; font-weight:700;
    border-radius:999px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center;
  }

  .section-title{
    font-family:'JetBrains Mono',monospace; font-size:12px; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--sign-green); margin:32px 0 14px;
  }
  .section-title:first-of-type{margin-top:0;}
  .empty{color:var(--asphalt); font-family:'JetBrains Mono',monospace; font-size:13px; padding:24px 0;}

  .card{background:#fff; border:2px solid var(--night); border-radius:10px; padding:20px; margin-bottom:14px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  .card h3{font-size:17px;}
  .status{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; padding:3px 8px; border-radius:10px;}
  .status.pending{background:#f2e4c4; color:#8a6415;}
  .status.confirmed{background:#d8ebe0; color:var(--sign-green);}
  .status.cancelled{background:#f0dcd6; color:var(--red);}
  .status.completed{background:#dbe4ea; color:#3a5f7a;}
  .meta{font-size:13px; color:var(--asphalt); margin-top:6px; line-height:1.7;}
  .meta b{color:var(--night);}
  .card-actions{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .trip-details{
    margin-top:16px; padding-top:14px; border-top:1px solid #e8e2d4;
    display:grid; grid-template-columns:1fr 1fr; gap:10px 20px;
  }
  .detail-row{font-size:13px;}
  .detail-row.full{grid-column:1/-1;}
  .detail-label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase;
    color:var(--asphalt); margin-bottom:2px; letter-spacing:0.04em;
  }
  .turnover-reminder{
    margin-top:14px; background:#402a10; color:#f5c877; padding:10px 12px;
    border-radius:10px; font-size:12px; line-height:1.5;
  }
  .turnover-reminder.allows-24hr{background:#16321f; color:#8fd8ac;}
  .btn-view{
    padding:8px 16px; border-radius:10px; font-size:12px; font-weight:700; text-transform:uppercase;
    border:2px solid var(--night); color:var(--night); text-decoration:none; display:inline-flex; align-items:center;
  }
  .btn-cancel{
    padding:8px 16px; border-radius:10px; font-size:12px; font-weight:700; text-transform:uppercase;
    border:none; cursor:pointer; background:var(--red); color:#fff;
  }
  .edit-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .edit-grid > div{min-width:0;}
  @media(max-width:520px){.edit-grid{grid-template-columns:1fr;}}
  .edit-grid label{
    font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--asphalt);
    display:block; margin-bottom:4px;
  }
  .edit-grid input{
    width:100%; min-width:0; padding:9px 11px; border:2px solid var(--night); border-radius:10px;
    font-family:'Inter',sans-serif; font-size:13px;
  }
  .btn-save{background:var(--night); color:var(--amber); border:none; padding:10px 18px; border-radius:10px; font-weight:700; font-size:12px; text-transform:uppercase; cursor:pointer;}
  .save-msg{font-size:12px; margin-top:8px; display:none;}
</style>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "36911a5edb0f4bdf95ab6da85ceccd46"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <a href="index.html" style="display:flex; align-items:center; gap:6px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; color:var(--night); text-decoration:none; margin-bottom:2px; border:none; padding:0; background:none;">
        <img src="logo-64.png" width="16" height="16" alt="" style="flex-shrink:0;"><span style="text-transform:none; letter-spacing:normal;">RV<span style="color:var(--sign-green);">n</span>B</span>
      </a>
      <h1>My Trips</h1>
    </div>
    <div class="btns" style="position:relative; align-items:center;">
      <a href="browse.html" style="border:1.5px solid var(--sign-green); color:var(--sign-green); padding:8px 16px; font-size:12px; text-transform:uppercase; font-weight:700; border-radius:999px; text-decoration:none; display:inline-flex; align-items:center;">Browse Listings</a>
      <div id="traveler-menu-wrap" style="position:relative;">
        <button id="traveler-menu-btn" style="background:none; border:1.5px solid var(--asphalt); color:var(--asphalt); padding:8px 16px; font-size:12px; text-transform:uppercase; font-weight:700; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; position:relative;">
          <span id="menu-email-short" style="text-transform:none;">Menu</span> ▾
          <span id="menu-notif-dot" style="display:none; position:absolute; top:2px; right:2px; width:9px; height:9px; border-radius:50%; background:var(--red); border:2px solid var(--lane);"></span>
        </button>
        <div id="traveler-menu-dropdown" style="display:none; position:absolute; top:calc(100% + 8px); right:0; background:#fff; border:1.5px solid var(--night); border-radius:12px; min-width:190px; z-index:100; overflow:hidden; box-shadow:0 6px 16px rgba(0,0,0,0.2);">
          <a href="profile.html?return=traveler-dashboard.html" id="account-email-full" style="display:block; padding:10px 14px; font-size:13px; text-transform:none; text-decoration:none; color:inherit; border:none; border-bottom:1px solid #e0ddd0; border-radius:0;">
            <span id="account-email-text" style="display:block; font-size:11px; color:var(--asphalt); word-break:break-all;"></span>
            <span style="display:block; font-size:10px; font-weight:700; color:var(--sign-green); text-transform:uppercase; letter-spacing:0.03em; margin-top:4px;">Edit Profile →</span>
          </a>
          <a href="notifications.html?return=traveler-dashboard.html" style="display:flex; align-items:center; justify-content:space-between; padding:11px 14px; font-size:13px; font-weight:600; text-transform:none; color:var(--night); text-decoration:none; border:none; border-bottom:1px solid #e0ddd0; border-radius:0;">
            Notifications
            <span id="menu-notif-count" style="display:none; background:var(--red); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px; align-items:center; justify-content:center; padding:0 4px;"></span>
          </a>
          <a href="admin.html" id="admin-btn" style="display:none; padding:11px 14px; font-size:13px; font-weight:600; text-transform:none; color:var(--sign-green); text-decoration:none; border:none; border-bottom:1px solid #e0ddd0; border-radius:0;">Admin Dashboard</a>
          <a href="analytics.html" id="analytics-btn" style="display:none; padding:11px 14px; font-size:13px; font-weight:600; text-transform:none; color:var(--sign-green); text-decoration:none; border:none; border-bottom:1px solid #e0ddd0; border-radius:0;">Analytics</a>
          <a href="traveler-dashboard.html" style="display:block; padding:11px 14px; font-size:13px; font-weight:600; text-transform:none; color:var(--night); text-decoration:none; border:none; border-bottom:1px solid #e0ddd0; border-radius:0;">Traveler Dashboard</a>
          <a href="host-dashboard.html" style="display:block; padding:11px 14px; font-size:13px; font-weight:600; text-transform:none; color:var(--night); text-decoration:none; border:none; border-bottom:1px solid #e0ddd0; border-radius:0;">Host Dashboard</a>
          <button id="logout-btn" style="display:block; width:100%; text-align:left; padding:11px 14px; font-size:13px; font-weight:600; text-transform:none; color:var(--red,#a4472b); background:none; border:none; border-radius:0; cursor:pointer;">Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="section-title">Upcoming</div>
  <div id="upcoming-container"><div class="empty">Loading...</div></div>

  <div class="section-title">Past &amp; Cancelled</div>
  <div id="past-container"></div>
</div>

<script>
  const SUPABASE_URL = 'https://icnhpciixqrhrqrzxkxg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljbmhwY2lpeHFyaHJxcnp4a3hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTY2MDMsImV4cCI6MjA5OTczMjYwM30.5a8nNSiSA7U89f2kGAHGNPPfYpFra0Ve7PIFtOq3GDk';
  const ADMIN_EMAIL = 'pierson.willhite@gmail.com';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  async function init(){
    const { data } = await supabaseClient.auth.getSession();
    if(!data.session){
      window.location.href = 'traveler-login.html?return=traveler-dashboard.html';
      return;
    }

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('is_paused')
      .eq('id', data.session.user.id)
      .single();

    if(profile && profile.is_paused){
      await supabaseClient.auth.signOut();
      window.location.href = 'traveler-login.html?paused=1';
      return;
    }

    currentUser = data.session.user;
    document.getElementById('account-email-text').textContent = currentUser.email;
    document.getElementById('menu-email-short').textContent = currentUser.email.split('@')[0];
    if(currentUser.email === ADMIN_EMAIL){
      document.getElementById('admin-btn').style.display = 'block';
      document.getElementById('analytics-btn').style.display = 'block';
    }
    loadTrips();
    checkUnreadNotifications();
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'traveler-login.html';
  });

  async function loadTrips(){
    const upcomingEl = document.getElementById('upcoming-container');
    const pastEl = document.getElementById('past-container');
    upcomingEl.innerHTML = '<div class="empty">Loading...</div>';
    pastEl.innerHTML = '';

    const { data, error } = await supabaseClient
      .from('bookings')
      .select('*, partners(id, business_name, city, state, address, arrival_time, departure_time, allows_24hr_parking, rules)')
      .eq('traveler_id', currentUser.id)
      .order('check_in', { ascending: true });

    if(error){
      upcomingEl.innerHTML = '<div class="empty">Could not load trips: ' + error.message + '</div>';
      return;
    }

    const today = new Date().toISOString().slice(0,10);
    const upcoming = data.filter(b => b.check_out >= today && b.status !== 'cancelled' && b.status !== 'completed');
    const past = data.filter(b => b.check_out < today || b.status === 'cancelled' || b.status === 'completed');

    upcomingEl.innerHTML = upcoming.length === 0 ? '<div class="empty">No upcoming trips yet — go find a spot!</div>' : '';
    upcoming.forEach(b => upcomingEl.appendChild(renderCard(b, true)));

    pastEl.innerHTML = past.length === 0 ? '<div class="empty">No past trips yet.</div>' : '';
    past.forEach(b => pastEl.appendChild(renderCard(b, false)));
  }

  function formatTime12hr(hhmm){
    if(!hhmm) return '';
    const [h, m] = hhmm.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const hour12 = h % 12 === 0 ? 12 : h % 12;
    return `${hour12}:${String(m).padStart(2,'0')} ${period}`;
  }

  function renderCard(b, allowCancel){
    const card = document.createElement('div');
    card.className = 'card';
    const p = b.partners;
    const spot = p ? p.business_name : 'Listing';
    const address = p ? `${p.address}, ${p.city}, ${p.state}` : '';
    card.innerHTML = `
      <div class="card-top">
        <div>
          <h3>${spot}</h3>
          <div class="meta">
            <b>${b.check_in} → ${b.check_out}</b><br>
            ${address}<br>
            $${b.total_charged ? Number(b.total_charged).toFixed(2) : Number(b.total_price).toFixed(2)} total (incl. fees &amp; tax)
          </div>
        </div>
        <span class="status ${b.status}">${b.status}</span>
      </div>

      ${p ? `
      <div class="trip-details">
        <div class="detail-row"><span class="detail-label">Arrive after</span><span>${formatTime12hr(p.arrival_time)}</span></div>
        <div class="detail-row"><span class="detail-label">Leave by</span><span>${formatTime12hr(p.departure_time)}</span></div>
        ${p.rules ? `<div class="detail-row full"><span class="detail-label">House rules</span><span>${p.rules}</span></div>` : ''}
      </div>
      <div class="turnover-reminder${p.allows_24hr_parking ? ' allows-24hr' : ''}">${
        p.allows_24hr_parking
          ? '✓ 24-hour parking — this is a designated RV spot, no daily departure required.'
          : `⚠ Vehicle must leave the lot by ${formatTime12hr(p.departure_time)} each morning and may not return until ${formatTime12hr(p.arrival_time)} — every night of this stay, not just once.`
      }</div>
      ` : ''}

      <div class="card-actions">
        ${p ? `<a href="listing.html?id=${p.id}&from=trips" class="btn-view">View Listing</a>` : ''}
        ${allowCancel && b.status !== 'cancelled' ? `<button class="btn-cancel" data-id="${b.id}">Cancel Trip</button>` : ''}
      </div>
    `;
    const cancelBtn = card.querySelector('.btn-cancel');
    if(cancelBtn){
      cancelBtn.addEventListener('click', async () => {
        if(!confirm('Cancel this trip? The host will be notified.')) return;
        cancelBtn.disabled = true;
        cancelBtn.textContent = 'Cancelling...';
        const { data, error } = await supabaseClient.functions.invoke('traveler-cancel-booking', {
          body: { bookingId: cancelBtn.dataset.id, confirm: true }
        });
        if(error || (data && data.error)){
          alert('Could not cancel: ' + (data?.error || error?.message || 'unknown error'));
          cancelBtn.disabled = false;
          cancelBtn.textContent = 'Cancel Trip';
          return;
        }
        loadTrips();
      });
    }
    return card;
  }

  // ============================================
  // NOTIFICATIONS — lightweight unread check only; the Menu link goes to
  // notifications.html for the actual list
  // ============================================
  async function checkUnreadNotifications(){
    const { count, error } = await supabaseClient
      .from('notifications')
      .select('id', { count: 'exact', head: true })
      .eq('user_id', currentUser.id)
      .eq('is_read', false);

    if(error) return;

    const dot = document.getElementById('menu-notif-dot');
    const countEl = document.getElementById('menu-notif-count');

    if(count > 0){
      dot.style.display = 'block';
      countEl.style.display = 'flex';
      countEl.textContent = count > 9 ? '9+' : count;
    } else {
      dot.style.display = 'none';
      countEl.style.display = 'none';
    }
  }

  (function(){
    const wrap = document.getElementById('traveler-menu-wrap');
    const btn = document.getElementById('traveler-menu-btn');
    const dropdown = document.getElementById('traveler-menu-dropdown');

    let closeTimer = null;
    const open = () => { clearTimeout(closeTimer); dropdown.style.display = 'block'; };
    const scheduleClose = () => { clearTimeout(closeTimer); closeTimer = setTimeout(() => { dropdown.style.display = 'none'; }, 200); };

    wrap.addEventListener('mouseenter', open);
    wrap.addEventListener('mouseleave', scheduleClose);

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', (e) => {
      if(!wrap.contains(e.target)){
        dropdown.style.display = 'none';
      }
    });
  })();

  init();
</script>

</body>
</html>
